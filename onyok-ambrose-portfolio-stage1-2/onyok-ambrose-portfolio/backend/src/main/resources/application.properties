# ------------------------------------------------------------------
# Onyok Ambrose portfolio: backend configuration
#
# Every secret is read from an environment variable. The defaults
# after the colon are for local development only. See .env.example.
# ------------------------------------------------------------------

spring.application.name=onyok-ambrose-portfolio
server.port=${PORT:8080}

# ---- PostgreSQL -------------------------------------------------------
# Render provides SPRING_DATASOURCE_* values for its PostgreSQL instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onyok_portfolio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:onyok}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---- JPA: Flyway owns the schema, Hibernate only checks it -----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway migrations (run automatically on startup) ----------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ---- Uploads: images and PDFs are stored in PostgreSQL ---------------
# Render's disk is ephemeral, so files on disk would be lost on redeploy.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Actuator: health only, used by Render's health check ------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- Application settings ---------------------------------------------
# JWT signing key: at least 32 characters. The application refuses to start without it.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Comma-separated list of frontend origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Used only to create the first administrator when no admin account exists.
# Remove these variables from Render after the first successful login.
app.admin.bootstrap-username=${ADMIN_USERNAME:}
app.admin.bootstrap-password=${ADMIN_PASSWORD:}

# Upload rules, enforced in code and matched by the database constraint.
app.upload.max-bytes=5242880
app.upload.allowed-types=image/jpeg,image/png,image/webp,application/pdf
